<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theo dõi tổng quan TikTok</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-wrapper">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64c.298-.002.595.042.88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 3 15.68 6.34 6.34 0 0 0 9.34 22a6.33 6.33 0 0 0 6.33-6.33V8.76a8.21 8.21 0 0 0 4.77 1.51V6.82a4.8 4.8 0 0 1-.85-.13z" fill="#FE2C55"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Theo dõi TikTok</h1>
          <span class="version">v1.0.0</span>
        </div>
      </div>
      <button id="btn-settings-icon" class="icon-btn" title="Cài đặt Google Sheet">⚙️</button>
    </header>

    <!-- Main Content -->
    <main class="popup-body">
      <!-- Status Card -->
      <div id="status-card" class="status-card loading">
        <div class="status-indicator"></div>
        <div class="status-info">
          <span class="status-label">Trạng thái trang:</span>
          <span id="current-channel" class="status-value">Đang kiểm tra tab...</span>
        </div>
      </div>

      <!-- Actions Area -->
      <div class="action-buttons">
        <button id="btn-start-scan" class="btn btn-primary" disabled>
          <span class="btn-icon">⚡</span>
          <span>Bắt đầu quét kênh</span>
        </button>

        <button id="btn-open-dashboard" class="btn btn-secondary">
          <span class="btn-icon">📊</span>
          <span>Mở Dashboard Báo Cáo</span>
        </button>
      </div>

      <!-- Quick Info / Last Scan -->
      <div class="quick-stats">
        <div class="stat-item">
          <span class="stat-title">Lần quét gần nhất</span>
          <span id="last-scan-time" class="stat-num">Chưa có</span>
        </div>
        <div class="stat-item">
          <span class="stat-title">Kênh đã lưu</span>
          <span id="saved-channel" class="stat-num">--</span>
        </div>
      </div>

      <!-- Google Sheets Connection Status -->
      <div class="sheets-badge-container">
        <span class="sheets-label">Google Sheet:</span>
        <span id="sheets-status" class="sheets-badge unconfigured">Chưa cài Webhook</span>
      </div>
    </main>

    <!-- Footer -->
    <footer class="popup-footer">
      <span>Serverless • Manifest V3 • Auto Google Sheet</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
